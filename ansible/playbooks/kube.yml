---
- name: Install local secret-administration tools
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - sops_cli

- name: Prepare all Kubernetes nodes
  hosts: kube_controllers:kube_workers
  become: true
  roles:
    - kube_common

- name: Initialize Kubernetes control plane
  hosts: kube_controllers
  become: true
  roles:
    - kube_control_plane

- name: Install Kubernetes CNI
  hosts: kube_controllers
  become: true
  roles:
    - kube_cni

- name: Join Kubernetes workers
  hosts: kube_workers
  become: true
  roles:
    - kube_worker

- name: Prepare Kubernetes workers for Rook Ceph OSDs
  hosts: kube_workers
  become: true
  roles:
    - kube_rook_ceph_worker_prep

- name: Install MetalLB
  hosts: kube_controllers
  become: true
  roles:
    - kube_metallb

- name: Install Istio
  hosts: kube_controllers
  become: true
  roles:
    - kube_istio

- name: Install Rook Ceph storage
  hosts: kube_controllers
  become: true
  roles:
    - kube_rook_ceph

- name: Install OpenBao secrets management
  hosts: kube_controllers
  become: true
  serial: 1
  roles:
    - sops_cli
    - kube_helm
    - kube_openbao

- name: Deploy nginx Istio smoke test
  hosts: kube_controllers
  become: true
  roles:
    - kube_smoke_nginx

