---
- name: Install local secret-administration tools
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  roles:
    - sops_cli

- name: Deploy the Kubernetes secrets-management platform
  hosts: kube_controllers
  become: true
  serial: 1
  roles:
    - sops_cli
    - kube_helm
    - kube_openbao

