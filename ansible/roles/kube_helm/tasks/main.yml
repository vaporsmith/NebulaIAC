---
- name: Check the installed Helm version
  ansible.builtin.command: "{{ kube_helm_install_path }} version --short"
  register: kube_helm_installed_version
  changed_when: false
  failed_when: false

- name: Install the pinned Helm release
  when: kube_helm_version not in kube_helm_installed_version.stdout
  block:
    - name: Create a temporary directory for Helm
      ansible.builtin.tempfile:
        state: directory
        suffix: helm
      register: kube_helm_tempdir

    - name: Download the Helm archive
      ansible.builtin.get_url:
        url: "{{ kube_helm_download_base_url }}/{{ kube_helm_archive_name }}"
        dest: "{{ kube_helm_tempdir.path }}/{{ kube_helm_archive_name }}"
        mode: "0644"

    - name: Download the published Helm archive checksum
      ansible.builtin.get_url:
        url: "{{ kube_helm_download_base_url }}/{{ kube_helm_archive_name }}.sha256sum"
        dest: "{{ kube_helm_tempdir.path }}/{{ kube_helm_archive_name }}.sha256sum"
        mode: "0644"

    - name: Verify the Helm archive checksum
      ansible.builtin.command:
        cmd: "sha256sum --check {{ kube_helm_archive_name }}.sha256sum"
        chdir: "{{ kube_helm_tempdir.path }}"
      changed_when: false

    - name: Extract the Helm archive
      ansible.builtin.unarchive:
        src: "{{ kube_helm_tempdir.path }}/{{ kube_helm_archive_name }}"
        dest: "{{ kube_helm_tempdir.path }}"
        remote_src: true

    - name: Install the Helm binary
      ansible.builtin.copy:
        src: "{{ kube_helm_tempdir.path }}/linux-{{ kube_helm_arch }}/helm"
        dest: "{{ kube_helm_install_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true

  always:
    - name: Remove the Helm temporary directory
      ansible.builtin.file:
        path: "{{ kube_helm_tempdir.path | default('/tmp/unused-kube-helm-tempdir') }}"
        state: absent

- name: Verify the pinned Helm release
  ansible.builtin.command: "{{ kube_helm_install_path }} version --short"
  register: kube_helm_final_version
  changed_when: false
  failed_when: kube_helm_version not in kube_helm_final_version.stdout

