---
openbao_namespace: "openbao"
openbao_release_name: "openbao"
openbao_chart_repository_name: "openbao"
openbao_chart_repository_url: "https://openbao.github.io/openbao-helm"
openbao_chart_version: "0.29.1"
openbao_kubeconfig: "/etc/kubernetes/admin.conf"
openbao_required_helm_version: "v3.19.0"

openbao_replicas: 3
openbao_storage_class: "ceph-rbd"
openbao_data_storage_size: "10Gi"
openbao_audit_storage_size: "10Gi"

# This Secret must already exist and contain tls.crt, tls.key, and ca.crt.
# It is intentionally not generated by this role because the CA is part of the
# offline recovery boundary.
openbao_tls_secret_name: "openbao-server-tls"
openbao_tls_mount_path: "/openbao/tls"
openbao_tls_server_name: "openbao.openbao.svc.cluster.local"

# Flannel alone does not enforce NetworkPolicy. Keep this false until a policy
# enforcing CNI is deployed and verified. The role fails closed by default.
kube_network_policy_enforced: false
openbao_require_network_policy_enforcement: true

# Namespaces must opt in with this label before their pods may reach port 8200:
#   security.nebulaiac.io/openbao-client: "true"
openbao_client_namespace_label: "security.nebulaiac.io/openbao-client"
openbao_client_namespace_label_value: "true"

# Used by OpenBao's Kubernetes service registration. Override if the API service
# address differs in this cluster.
openbao_kubernetes_api_cidr: "10.96.0.1/32"

openbao_cpu_request: "250m"
openbao_cpu_limit: "1000m"
openbao_memory_request: "256Mi"
openbao_memory_limit: "1Gi"

openbao_istio_injection: "disabled"
openbao_rendered_values_path: "/tmp/openbao-values.yaml"
openbao_rendered_network_policy_path: "/tmp/openbao-network-policy.yaml"

# Idempotent initialization and unseal settings. Set the recipient in inventory
# or an unencrypted environment-specific vars file; an age recipient is public.
openbao_manage_initialization: true
openbao_age_recipient: ""
openbao_key_shares: 5
openbao_key_threshold: 3
openbao_remote_recovery_directory: "/var/lib/nebulaiac/bootstrap"
openbao_remote_recovery_file: "{{ openbao_remote_recovery_directory }}/openbao-init.sops.json"
openbao_age_directory: "/data/.age"
openbao_age_identity_file: "{{ openbao_age_directory }}/keys.txt"
openbao_local_recovery_file: "{{ openbao_age_directory }}/openbao-init.sops.json"

