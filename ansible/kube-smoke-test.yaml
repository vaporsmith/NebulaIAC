# ansible/kube-smoke-test.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-nginx
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smoke-nginx
  template:
    metadata:
      labels:
        app: smoke-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: smoke-nginx
  namespace: default
spec:
  type: NodePort
  selector:
    app: smoke-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
